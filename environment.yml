# Conda environment for the Bridgeway biotech insider-signal submission.
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
#
# Python and numerical versions match the saved S5 environment. PyArrow 25
# is a verified compatible reader; its historical version was not recorded.
name: bridgeway
channels:
  - conda-forge
dependencies:
  - python=3.12.2
  # numerics and statistics (pinned to the recorded research environment)
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.13.1
  - statsmodels=0.14.2
  # storage, charts and notebooks
  - pyarrow=25.0.0
  - matplotlib
  - nbformat
  - nbclient
  - ipykernel
  # SEC / EDGAR access and parsing
  - requests
  - lxml
  # WRDS Cloud tunnel (only needed to rebuild the universe or pull CRSP)
  - psycopg2
  - pexpect
  # tests
  - pytest
